<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Billiards Service Scheduler</title>
    <link rel="stylesheet" href="styles.css?v=beta-feedback" />
  </head>
  <body>
    <main class="app-shell">
      <audio id="welcomeAudio" src="assets/speech.mp3" preload="auto"></audio>

      <section class="login-view" id="loginView" aria-label="Login screen">
        <div class="ambient-layer" aria-hidden="true">
          <span class="glass-sheen sheen-one"></span>
          <span class="glass-sheen sheen-two"></span>
          <span class="glass-sheen sheen-three"></span>
        </div>

        <div class="login-panel glass-panel">
          <div class="brand-lockup">
            <img src="assets/home-billiards-logo-app.png" alt="Home Billiards" width="520" height="304" />
          </div>

          <div class="login-copy">
            <p class="eyebrow">Daily operations</p>
            <h1>Open your schedule</h1>
            <p>Choose a work profile to manage appointments, clients, crews, and service work.</p>
          </div>

          <form class="login-form" id="loginForm">
            <label for="userSelect">Work user</label>
            <div class="select-wrap">
              <select id="userSelect" name="user">
                <option value="shawn" selected>Shawn</option>
                <option value="keith">Keith</option>
                <option value="herlyn">Herlyn</option>
                <option value="diego">Diego</option>
                <option value="mark">Mark</option>
              </select>
            </div>

            <label for="pinInput">PIN</label>
            <input
              id="pinInput"
              name="pin"
              type="password"
              inputmode="numeric"
              autocomplete="current-password"
              placeholder="Enter PIN"
            />

            <button class="primary-action" type="submit">Open scheduler</button>
          </form>
        </div>
      </section>

      <section class="startup-view is-hidden" id="startupView" aria-label="Welcome">
        <div class="startup-glass" aria-hidden="true"></div>
        <div class="startup-message">
          <p id="startupGreeting">Good Morning, Shawn!</p>
        </div>
      </section>

      <section class="dashboard-view is-hidden" id="dashboardView" aria-label="Dashboard">
        <div class="dashboard-bg" aria-hidden="true">
          <span class="refract refract-one"></span>
          <span class="refract refract-two"></span>
          <span class="refract refract-three"></span>
        </div>

        <aside class="sidebar glass-panel" aria-label="App navigation">
          <div class="sidebar-brand">
            <img src="assets/home-billiards-logo-app.png" alt="Home Billiards" width="520" height="304" />
          </div>

          <nav class="nav-stack" aria-label="Dashboard apps">
            <button class="nav-item is-active" type="button" data-module="home" aria-label="Home">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M4 11.5 12 5l8 6.5" />
                  <path d="M6.5 10.5V20h11v-9.5" />
                  <path d="M10 20v-5h4v5" />
                </svg>
              </span>
              <span>Home</span>
            </button>
            <button class="nav-item" type="button" data-module="schedule" aria-label="Calendar">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M7 3v3M17 3v3M5 9h14" />
                  <rect x="4" y="5" width="16" height="15" rx="3" />
                  <path d="M8 13h3M8 16h5" />
                </svg>
              </span>
              <span>Calendar</span>
            </button>
            <button class="nav-item" type="button" data-module="jobs" aria-label="Open jobs">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M6 5.5h12v15H6z" />
                  <path d="M9 3.5h6l1 2H8l1-2Z" />
                  <path d="M9 10h6M9 13.5h6M9 17h3" />
                </svg>
              </span>
              <span>Open Jobs</span>
            </button>
            <button class="nav-item" type="button" data-module="customOrders" aria-label="Custom orders">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M5 7.5h14v9H5z" />
                  <path d="M8 16.5v2M16 16.5v2" />
                  <path d="M7.5 10.5h9M7.5 13.5h5" />
                  <path d="m17 5 2 2-2 2" />
                </svg>
              </span>
              <span>Custom Orders</span>
            </button>
            <button class="nav-item" type="button" data-module="clients" aria-label="Clients">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M16 20v-1.7a3.3 3.3 0 0 0-3.3-3.3H7.3A3.3 3.3 0 0 0 4 18.3V20" />
                  <circle cx="10" cy="8" r="4" />
                  <path d="M19 20v-1.5a3 3 0 0 0-2.2-2.9M16.5 4.4a4 4 0 0 1 0 7.2" />
                </svg>
              </span>
              <span>Clients</span>
            </button>
            <button class="nav-item" type="button" data-module="services" aria-label="Services">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M14.5 5.5a4.5 4.5 0 0 0 4 6.9l-7.1 7.1a2.5 2.5 0 1 1-3.5-3.5l7.1-7.1a4.5 4.5 0 0 0-.5-3.4Z" />
                  <path d="M8.5 17.5h.01" />
                </svg>
              </span>
              <span>Services</span>
            </button>
            <button class="nav-item" type="button" data-module="tickets" aria-label="Service tickets">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M5 6.5h14v4a2 2 0 0 0 0 4v4H5v-4a2 2 0 0 0 0-4v-4Z" />
                  <path d="M9 9h6M9 12h4M9 15h5" />
                </svg>
              </span>
              <span>Tickets</span>
            </button>
            <button class="nav-item" type="button" data-module="cueRepairs" aria-label="Cue repairs">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M5 19 19 5" />
                  <path d="m15.5 4.5 4 4" />
                  <path d="M4.5 17.5 6.5 19.5" />
                  <path d="M9 15h6" />
                  <path d="M11 12h5" />
                </svg>
              </span>
              <span>Cue Repairs</span>
            </button>
            <button class="nav-item" type="button" data-module="team" aria-label="Team">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M12 4.5 18.5 8v8L12 19.5 5.5 16V8L12 4.5Z" />
                  <path d="M12 12.5 18.5 9M12 12.5 5.5 9M12 12.5v7" />
                </svg>
              </span>
              <span>Team</span>
            </button>
            <button class="nav-item" type="button" data-module="projects" aria-label="Projects">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M4.5 5.5h15v4h-15z" />
                  <path d="M6 13h12" />
                  <path d="M6 17.5h8" />
                  <path d="m15.5 17.5 1.5 1.5 3-3" />
                </svg>
              </span>
              <span>Projects</span>
            </button>
            <button class="nav-item is-hidden" type="button" data-module="development" data-dev-only aria-label="Development">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="m8 9-4 3 4 3" />
                  <path d="m16 9 4 3-4 3" />
                  <path d="m14 5-4 14" />
                </svg>
              </span>
              <span>Development</span>
            </button>
            <button class="nav-item" type="button" data-module="notes" aria-label="Notes">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M6 4.5h9.5L19 8v11.5H6z" />
                  <path d="M15 4.5V8h4" />
                  <path d="M9 12h6M9 15h4" />
                </svg>
              </span>
              <span>Notes</span>
            </button>
            <button class="nav-item" type="button" data-module="chat" aria-label="Staff chat">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <path d="M5 6.5h14v9H9l-4 3v-12Z" />
                  <path d="M8.5 10.5h7M8.5 13h4" />
                </svg>
              </span>
              <span>Chat</span>
              <span class="nav-unread-badge" aria-hidden="true"></span>
            </button>
            <button class="nav-item" type="button" data-module="settings" aria-label="Settings">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                  <circle cx="12" cy="12" r="3" />
                  <path d="M19 12a7.8 7.8 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7.5 7.5 0 0 0-2-1.2L14.2 3h-4.4l-.3 2.6a7.5 7.5 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.5A7.8 7.8 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.5 2.4-1a7.5 7.5 0 0 0 2 1.2l.3 2.6h4.4l.3-2.6a7.5 7.5 0 0 0 2-1.2l2.4 1 2-3.5-2-1.5c.1-.4.1-.8.1-1.2Z" />
                </svg>
              </span>
              <span>Settings</span>
            </button>
          </nav>

          <div class="sidebar-footer">
            <div class="beta-feedback" id="betaFeedback">
              <div class="beta-feedback-actions" role="group" aria-label="Beta feedback">
                <button class="secondary-action compact" type="button" data-beta-open="bug">Bug report</button>
                <button class="secondary-action compact" type="button" data-beta-open="feature">Feature request</button>
              </div>
              <form class="beta-feedback-panel is-hidden" id="betaFeedbackPanel" aria-label="Beta feedback form">
                <div class="quick-type-row" role="group" aria-label="Feedback type">
                  <button class="is-active" type="button" data-beta-type="bug">Bug</button>
                  <button type="button" data-beta-type="feature">Feature</button>
                </div>

                <input type="hidden" name="type" id="betaFeedbackType" value="bug" />

                <label for="betaFeedbackTitle">Title</label>
                <input id="betaFeedbackTitle" name="title" maxlength="90" placeholder="Quick title" required />

                <label for="betaFeedbackDetails">Details</label>
                <textarea id="betaFeedbackDetails" name="details" rows="3" maxlength="700" placeholder="What happened or what would help?"></textarea>

                <div class="beta-screenshot-field" id="betaScreenshotField">
                  <button class="secondary-action compact" type="button" id="betaScreenshotButton">Take screenshot</button>
                  <span id="betaScreenshotStatus">No screenshot yet</span>
                  <img class="beta-screenshot-preview is-hidden" id="betaScreenshotPreview" alt="Bug report screenshot preview" />
                </div>

                <p class="form-alert" id="betaFeedbackAlert" hidden></p>

                <div class="quick-add-actions">
                  <button class="text-action" type="button" id="betaFeedbackClose">Close</button>
                  <button class="primary-action compact" type="submit">Submit</button>
                </div>
              </form>
            </div>
            <div class="quick-capture" id="quickCapture">
              <button class="quick-add-button" type="button" id="quickAddButton" aria-expanded="false" aria-controls="quickAddPanel">
                <span aria-hidden="true">+</span>
                <strong>Quick add</strong>
              </button>
              <form class="quick-add-panel is-hidden" id="quickAddPanel" aria-label="Quick add card">
                <div class="quick-type-row" role="group" aria-label="Quick add type">
                  <button class="is-active" type="button" data-quick-type="note">Note</button>
                  <button type="button" data-quick-type="reminder">Reminder</button>
                  <button type="button" data-quick-type="suggestion">Suggestion</button>
                </div>

                <input type="hidden" name="type" id="quickAddType" value="note" />

                <label for="quickAddTitle">Title</label>
                <input id="quickAddTitle" name="title" maxlength="90" placeholder="Quick title" required />

                <label for="quickAddBody">Details</label>
                <textarea id="quickAddBody" name="body" rows="3" maxlength="420" placeholder="A few words are enough"></textarea>

                <label class="quick-reminder-field is-hidden" for="quickAddReminderAt">Reminder</label>
                <input class="quick-reminder-field is-hidden" id="quickAddReminderAt" name="reminderAt" type="datetime-local" />

                <div class="quick-add-actions">
                  <button class="text-action" type="button" id="quickAddClose">Close</button>
                  <button class="primary-action compact" type="submit">Add</button>
                </div>
              </form>
            </div>
            <div class="user-chip">
              <span class="avatar" id="userAvatar">S</span>
              <div>
                <strong id="userName">Shawn</strong>
                <small id="userRole">Home Billiards</small>
              </div>
            </div>
            <button class="ghost-action" type="button" id="logoutButton">Sign out</button>
          </div>
        </aside>

        <section class="canvas-wrap">
          <header class="canvas-topbar glass-strip">
            <div>
              <p class="eyebrow" id="moduleEyebrow">Business overview</p>
              <h2 id="moduleTitle">Home</h2>
            </div>
            <div class="topbar-actions">
              <button class="icon-button" type="button" id="todayShortcut" aria-label="Jump to today">Today</button>
              <button class="icon-button" type="button" id="newJobShortcut" aria-label="New appointment">+</button>
            </div>
          </header>

          <div class="module-canvas" id="moduleCanvas" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
